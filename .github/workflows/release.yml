name: Build setup

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '@latest: compare latest release. Or a tag (v1.1). @build: build selected commit only.'
        type: string
        required: false
        default: '@latest'
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      source_commit: ${{ steps.source.outputs.source_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve source commit and published asset
        id: source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 launcher/verify-setup.py resolve \
            --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" \
            --source-commit "$(git rev-parse HEAD)" --recipe-commit "$(git rev-parse HEAD)" \
            --output source.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-context
          path: source.json
          if-no-files-found: error

  build:
    needs: resolve
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        copy: [a, b]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: recipe
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.source_commit }}
          path: checkout
          persist-credentials: false
      - name: Snapshot exact Git bytes (independent of checkout line endings)
        shell: pwsh
        run: |
          New-Item -ItemType Directory source, dist | Out-Null
          git -C checkout archive HEAD -o ../source.tar
          if ($LASTEXITCODE) { throw 'git archive failed' }
          tar -xf source.tar -C source
          if ($LASTEXITCODE) { throw 'source extraction failed' }
      - name: Download and verify locked build tools
        shell: pwsh
        run: ./recipe/launcher/prepare-build.ps1 -Destination tools *>&1 | Tee-Object -FilePath dist/tools.log
      - name: Compile and package
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ needs.resolve.outputs.source_commit }}
          PYTHONUTF8: '1'
        run: |
          $recipeCommit = git -C recipe rev-parse HEAD
          & ./tools/python/python.exe -u recipe/launcher/montar-instalador-ci.py `
            --source source --source-commit $env:SOURCE_COMMIT --recipe-commit $recipeCommit `
            --tools tools --work build --saida dist *>&1 | Tee-Object -FilePath dist/build.log
          if ($LASTEXITCODE) { throw 'Installer build failed' }
      - name: Preserve build outputs and logs, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-${{ matrix.copy }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  verify:
    needs: [resolve, build]
    if: ${{ always() && needs.resolve.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '*'
          path: artifacts
      - name: Test verification failure paths
        run: python3 -m unittest discover -s launcher/tests -v
      - name: Compare complete SHA-256 (never normalize executables)
        id: comparison
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          python3 launcher/verify-setup.py compare --context artifacts/source-context/source.json \
            --build-a artifacts/build-a --build-b artifacts/build-b --output evidence
      - name: Attest the rebuilt installer and verification report after equality passes
        id: attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            artifacts/build-a/*.exe
            evidence/verification.json
      - name: Save signed attestation bundle
        env:
          BUNDLE: ${{ steps.attestation.outputs.bundle-path }}
        run: cp "$BUNDLE" evidence/attestation.jsonl
      - name: Preserve comparison evidence even on mismatch
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-evidence
          path: |
            evidence/*.json
            evidence/*.jsonl
            evidence/*.md
          if-no-files-found: warn
          retention-days: 90

  publish:
    needs: [build, verify]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-a
          path: installer
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verification-evidence
          path: evidence
      - name: Publish verified build (new tags only, no replacement of existing releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv installer/*.exe 'Bleach.Soul.Resurreccion.-.Setup.exe'
          sha256sum 'Bleach.Soul.Resurreccion.-.Setup.exe' > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file evidence/summary.md \
            'Bleach.Soul.Resurreccion.-.Setup.exe' SHA256SUMS.txt evidence/*
